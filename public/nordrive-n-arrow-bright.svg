<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Cyan Glow -->
    <filter id="brightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <g filter="url(#brightGlow)">
    <!-- LEFT STEM OF 'N' - PURE CRISP WHITE -->
    <path d="M 18 20 L 38 20 L 38 52 L 18 72 Z" fill="#FFFFFF" />

    <!-- RIGHT STEM OF 'N' - PURE CRISP WHITE -->
    <path d="M 62 48 L 82 28 L 82 80 L 62 80 Z" fill="#FFFFFF" />

    <!-- ASCENDING ARROW - VIBRANT ELECTRIC CYAN (POPS OUT INSTANTLY!) -->
    <!-- Diagonal shaft -->
    <path d="M 14 76 L 72 18 L 80 26 L 22 84 Z" fill="url(#arrowGrad)" stroke="#0284C7" stroke-width="1" />

    <!-- Arrow head -->
    <polygon points="90,6 60,18 78,36" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1" />
  </g>
</svg>
