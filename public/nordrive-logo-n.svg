<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nordBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- N Letter Gradient -->
    <linearGradient id="nGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glowing Circle Base -->
  <circle cx="50" cy="50" r="46" fill="url(#nordBg)" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2.5" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />

  <!-- Ultra-Clean Geometric "N" Emblem with Mountain Peak Slash -->
  <g filter="url(#cyanGlow)">
    <!-- Left Vertical Stem -->
    <path d="M 30 26 L 40 26 L 40 74 L 30 74 Z" fill="url(#nGradient)" />
    
    <!-- Diagonal Slash with Nordic Mountain Cut -->
    <path d="M 38 26 L 68 64 L 68 74 L 58 74 L 30 38 L 30 26 Z" fill="url(#nGradient)" />
    
    <!-- Right Vertical Stem -->
    <path d="M 60 26 L 70 26 L 70 74 L 60 74 Z" fill="url(#nGradient)" />
    
    <!-- Compass/Nordic Mountain Star Accent Top Center -->
    <polygon points="50,18 53,24 50,22 47,24" fill="#38BDF8" />
  </g>
</svg>
