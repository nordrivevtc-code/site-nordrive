<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Vibrant Nordrive Cyan Gradient -->
    <linearGradient id="exactNordGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="exactGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#exactGlow)">
    <!-- LEFT STEM OF N -->
    <path d="M 90 80 
             L 180 80 
             L 180 230 
             L 90 320 Z" 
          fill="url(#exactNordGradient)" />

    <!-- RIGHT STEM OF N -->
    <path d="M 320 180 
             L 410 90 
             L 410 420 
             L 320 420 Z" 
          fill="url(#exactNordGradient)" />

    <!-- ASCENDING DIAGONAL ARROW -->
    <!-- Shaft -->
    <path d="M 60 410 
             L 360 110 
             L 420 170 
             L 120 470 Z" 
          fill="url(#exactNordGradient)" />

    <!-- Arrow Head -->
    <polygon points="460,70 330,130 400,200" fill="#38BDF8" />
  </g>
</svg>
