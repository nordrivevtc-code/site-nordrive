<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Nordrive Electric Cyan Gradient -->
    <linearGradient id="exactCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="exactGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Mask for clean parallel gap cutouts -->
    <mask id="nGapCutout">
      <rect x="0" y="0" width="100" height="100" fill="#FFFFFF" />
      <!-- Black stroke cuts a 5px uniform gap along the arrow shaft -->
      <path d="M 0 95 L 85 10" stroke="#000000" stroke-width="7" stroke-linecap="square" />
    </mask>
  </defs>

  <g filter="url(#exactGlow)">
    <!-- 1. THE STEMS OF 'N' (Cutout by the diagonal gap mask) -->
    <g mask="url(#nGapCutout)">
      <!-- Left Pillar -->
      <path d="M 12 14 L 38 14 L 38 70 L 12 96 Z" fill="url(#exactCyanGrad)" />
      
      <!-- Right Pillar -->
      <path d="M 62 30 L 88 4 L 88 96 L 62 96 Z" fill="url(#exactCyanGrad)" />
    </g>

    <!-- 2. THE ASCENDING DIAGONAL ARROW -->
    <!-- Shaft -->
    <path d="M 6 96 L 76 26 L 86 36 L 16 106 Z" fill="url(#exactCyanGrad)" />
    
    <!-- Arrowhead at Top-Right -->
    <polygon points="98,4 66,16 84,34" fill="#38BDF8" stroke="#FFFFFF" stroke-width="0.8" />
  </g>
</svg>
