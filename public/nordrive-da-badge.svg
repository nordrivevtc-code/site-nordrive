<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Nordrive DA Gradient: Cyan Blue to Emerald -->
    <linearGradient id="nordDaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="55%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glowing Circle Badge (Matching Nordrive 3D Badge DA) -->
  <circle cx="50" cy="50" r="46" fill="url(#nordDaBg)" stroke="rgba(56, 189, 248, 0.7)" stroke-width="2" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />

  <!-- Inside Emblem: N-Arrow Ascending Logo -->
  <g filter="url(#badgeGlow)">
    <!-- LEFT STEM OF N -->
    <path d="M 26 26 L 38 26 L 38 52 L 26 64 Z" fill="url(#arrowGrad)" />

    <!-- RIGHT STEM OF N -->
    <path d="M 62 48 L 74 36 L 74 74 L 62 74 Z" fill="url(#arrowGrad)" />

    <!-- ASCENDING ARROW -->
    <!-- Shaft -->
    <path d="M 20 70 L 68 22 L 75 29 L 27 77 Z" fill="#38BDF8" stroke="#FFFFFF" stroke-width="0.5" />
    
    <!-- Arrowhead -->
    <polygon points="84,12 60,20 74,34" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1" />
  </g>
</svg>
