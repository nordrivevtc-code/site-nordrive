<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="nBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="arrowCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#logoGlow)">
    <!-- LEFT STEM OF 'N' -->
    <path d="M 18 20 L 36 20 L 36 50 L 18 68 Z" fill="url(#nBlue)" />

    <!-- RIGHT STEM OF 'N' -->
    <path d="M 64 50 L 82 32 L 82 80 L 64 80 Z" fill="url(#nBlue)" />

    <!-- ASCENDING ARROW -->
    <!-- Diagonal Shaft -->
    <path d="M 12 76 L 72 16 L 82 26 L 22 86 Z" fill="url(#arrowCyan)" />

    <!-- Arrowhead at Top Right -->
    <polygon points="94,6 64,16 84,36" fill="#38BDF8" />
  </g>
</svg>
